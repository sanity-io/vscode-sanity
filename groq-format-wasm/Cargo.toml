[package]
name = "groq-format-wasm"
version = "0.1.0"
edition = "2024"
description = "groq-format compiled to WebAssembly, for formatting GROQ shown in hovers"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
groq-format = { git = "https://github.com/atombender/groq-format.git" }
# The same version as the wasm-bindgen-cli scripts/build-groq-format.sh runs.
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
