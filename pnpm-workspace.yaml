# pnpm 12 reads project settings from here, including for a single package.
# vsce publish shells out to this signer, whose postinstall copies the platform binary into place.
allowBuilds:
  '@vscode/vsce-sign': true

# pnpm's default supply-chain policy refuses versions published in the last day. These are this
# org's own packages, and the extension cannot install without the current ones.
minimumReleaseAgeExclude:
  - '@sanity-labs/*'
  # 3.0.0 is the shared oxlint preset this repo extends, and it shipped within the last day.
  - '@nkzw/oxlint-config'
  # Both shipped within the last day and carry groq-js's defined() filter narrowing.
  - groq-js@2.0.2
  - '@sanity/codegen@8.3.2'
